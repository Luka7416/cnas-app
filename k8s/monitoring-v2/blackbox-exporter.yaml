apiVersion: v1
kind: ConfigMap
metadata:
  name: cnas-blackbox-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: true
          valid_status_codes: []
---
apiVersion: v1
kind: Service
metadata:
  name: cnas-blackbox-exporter
  namespace: monitoring
  labels:
    app: cnas-blackbox-exporter
spec:
  selector:
    app: cnas-blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnas-blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cnas-blackbox-exporter

  template:
    metadata:
      labels:
        app: cnas-blackbox-exporter

    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0
          imagePullPolicy: IfNotPresent

          args:
            - "--config.file=/etc/blackbox/blackbox.yml"

          ports:
            - name: http
              containerPort: 9115

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            - name: blackbox-config
              mountPath: /etc/blackbox
              readOnly: true

      volumes:
        - name: blackbox-config
          configMap:
            name: cnas-blackbox-config
