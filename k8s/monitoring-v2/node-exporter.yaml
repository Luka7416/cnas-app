apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnas-node-exporter
  namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: cnas-node-exporter
  namespace: monitoring
  labels:
    app: cnas-node-exporter
spec:
  selector:
    app: cnas-node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cnas-node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: cnas-node-exporter
  template:
    metadata:
      labels:
        app: cnas-node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cnas-node-exporter
      hostNetwork: true
      hostPID: true

      tolerations:
        - operator: Exists

      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.0
          args:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/rootfs"
            - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/containerd/.+|var/lib/kubelet/.+)($|/)"

          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 100Mi

          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /rootfs
              readOnly: true

      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
