apiVersion: v1
kind: ConfigMap
metadata:
  name: cnas-prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

      external_labels:
        environment: "cnas-lab"

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"

      # Operating-system metrics from both nodes
      - job_name: "node-exporter"
        static_configs:
          - targets:
              - "192.168.2.21:9100"
              - "192.168.2.22:9100"

      # Kubernetes object-state metrics
      - job_name: "kube-state-metrics"
        static_configs:
          - targets:
              - "cnas-kube-state-metrics.monitoring.svc.cluster.local:8080"

      # PHP application availability and response-time monitoring
      - job_name: "php-blackbox"
        metrics_path: /probe

        params:
          module:
            - http_2xx

        static_configs:
          - targets:
              - "http://php-service.cnas-app.svc.cluster.local:80/"

        relabel_configs:
          - source_labels:
              - __address__
            target_label: __param_target

          - source_labels:
              - __param_target
            target_label: instance

          - target_label: __address__
            replacement: "cnas-blackbox-exporter.monitoring.svc.cluster.local:9115"

      # Container CPU, memory, network and filesystem metrics
      - job_name: "kubelet-cadvisor"

        scheme: https

        kubernetes_sd_configs:
          - role: node

        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels:
              - __meta_kubernetes_node_name
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: node
