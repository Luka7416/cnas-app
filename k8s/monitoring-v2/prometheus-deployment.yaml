apiVersion: v1
kind: Service
metadata:
  name: cnas-prometheus
  namespace: monitoring
  labels:
    app: cnas-prometheus
spec:
  type: NodePort
  selector:
    app: cnas-prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnas-prometheus
  namespace: monitoring
  labels:
    app: cnas-prometheus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cnas-prometheus

  template:
    metadata:
      labels:
        app: cnas-prometheus

    spec:
      serviceAccountName: cnas-prometheus

      containers:
        - name: prometheus
          image: prom/prometheus:latest-distroless
          imagePullPolicy: IfNotPresent

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=2d"
            - "--storage.tsdb.retention.size=1GB"

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 600Mi

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true

            - name: prometheus-data
              mountPath: /prometheus

      volumes:
        - name: prometheus-config
          configMap:
            name: cnas-prometheus-config

        - name: prometheus-data
          emptyDir:
            sizeLimit: 2Gi
